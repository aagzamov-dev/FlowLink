name: Prepare installers (no publishing)
on:
  workflow_dispatch:
    inputs:
      signing:
        description: Platform signing (development files are for testing only)
        type: choice
        options: [development, production]
        default: development
        required: true
permissions:
  contents: read
concurrency:
  group: prepare-installers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - os: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run release:check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && inputs.signing == 'production'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Configure Windows code-signing certificate secrets before preparing production installers." }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'flowlink-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          } finally {
            Remove-Item -Path $certificatePath -ErrorAction SilentlyContinue
          }
      - name: Prepare signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release.mjs config ${{ matrix.target }} ${{ inputs.signing }}
      - name: Build signed update packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ inputs.signing == 'production' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.signing == 'production' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.signing == 'production' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ inputs.signing == 'production' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.signing == 'production' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signing == 'production' && secrets.APPLE_TEAM_ID || '' }}
        run: npm run desktop:build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config .tools/release-config.json -- --locked
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict target/${{ matrix.target }}/release/bundle/macos/FlowLink.app
      - name: Verify macOS notarization
        if: runner.os == 'macOS' && inputs.signing == 'production'
        run: xcrun stapler validate target/${{ matrix.target }}/release/bundle/macos/FlowLink.app
      - name: Verify Windows signature
        if: runner.os == 'Windows' && inputs.signing == 'production'
        shell: pwsh
        run: |
          Get-ChildItem 'target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe' | ForEach-Object {
            if ((Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid') { throw 'Windows installer signature is invalid.' }
          }
      - run: node scripts/release.mjs collect ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-${{ matrix.platform }}
          path: .tools/release-artifacts/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          pattern: prepared-*
          path: .tools/release-artifacts
          merge-multiple: true
      - run: node scripts/release.mjs manifest .tools/release-artifacts
      - uses: actions/upload-artifact@v7
        id: prepared
        with:
          name: FlowLink-prepared-${{ inputs.signing }}
          path: .tools/release-artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preparation summary
        env:
          ARTIFACT_URL: ${{ steps.prepared.outputs.artifact-url }}
          SIGNING_MODE: ${{ inputs.signing }}
        run: |
          echo "Prepared $SIGNING_MODE Mac and Windows installers, signatures, checksums and latest.json." >> "$GITHUB_STEP_SUMMARY"
          echo "[Download prepared files]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing was published. No release or tag was created. Development files must not be published as a production update." >> "$GITHUB_STEP_SUMMARY"
