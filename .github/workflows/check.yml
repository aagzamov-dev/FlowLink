name: Check FlowLink
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build macOS executable
        if: runner.os == 'macOS'
        run: cargo build --release -p flowlink --locked
      - name: Build Windows x64 installer
        if: runner.os == 'Windows'
        run: npm run desktop:build -- --ci --bundles nsis --target x86_64-pc-windows-msvc -- --locked
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        id: windows-installer
        uses: actions/upload-artifact@v7
        with:
          name: FlowLink-windows-x64-installer
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Add installer download link
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INSTALLER_URL: ${{ steps.windows-installer.outputs.artifact-url }}
        run: |
          "### Windows x64 test installer" >> $env:GITHUB_STEP_SUMMARY
          "[Download FlowLink installer]($env:INSTALLER_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Extract the downloaded ZIP and run the setup.exe inside. This development installer is unsigned." >> $env:GITHUB_STEP_SUMMARY
